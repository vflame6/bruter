version: "2"
run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gocritic
  exclusions:
    rules:
      # Tests assert on results, not on the error of every cleanup call.
      - path: '_test\.go'
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
