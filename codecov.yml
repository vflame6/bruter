# Coverage is reported, not enforced: most of the tree is protocol handlers that
# can only be exercised against live services from tests/*.sh, so a hard gate
# would reject otherwise good pull requests.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

ignore:
  - "tests/**"
  - "wordlists/*.txt"
  - "static/**"
